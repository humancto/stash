[package]
name = "stash"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
librqbit = { version = "9.1.0", default-features = false, features = ["rust-tls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["full"] }
tokio-util = { version = "0.7.20", features = ["io"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
tempfile = "3"

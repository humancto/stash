<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>stash</title>
<style>
  :root { color-scheme: light dark; --line: color-mix(in srgb, currentColor 15%, transparent); --accent: #3b82f6; }
  * { box-sizing: border-box; }
  body { font: 15px/1.45 system-ui, sans-serif; max-width: 860px; margin: 0 auto; padding: 24px 16px 80px; }
  h1 { font-size: 20px; margin: 0 0 16px; }
  form { display: flex; gap: 8px; margin-bottom: 8px; }
  input { flex: 1; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; font: inherit; background: transparent; color: inherit; min-width: 0; }
  button { padding: 8px 14px; border: 1px solid var(--line); border-radius: 8px; font: inherit; background: transparent; color: inherit; cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  #msg { min-height: 20px; font-size: 13px; color: #dc2626; margin-bottom: 12px; }
  video { width: 100%; max-height: 60vh; background: #000; border-radius: 8px; margin-bottom: 16px; }
  .t { border: 1px solid var(--line); border-radius: 10px; padding: 14px; margin-bottom: 12px; }
  .head { display: flex; gap: 8px; align-items: baseline; }
  .name { font-weight: 600; flex: 1; overflow-wrap: anywhere; }
  .meta { font-size: 13px; opacity: .7; margin: 4px 0 8px; font-variant-numeric: tabular-nums; }
  .bar { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; }
  .bar > div { height: 100%; background: var(--accent); }
  .files { margin: 10px 0 0; padding: 0; list-style: none; font-size: 14px; }
  .files li { display: flex; gap: 10px; padding: 5px 0; border-top: 1px solid var(--line); align-items: baseline; }
  .files .fn { flex: 1; overflow-wrap: anywhere; }
  .files .sz { opacity: .6; font-size: 12px; white-space: nowrap; }
  a { color: var(--accent); text-decoration: none; white-space: nowrap; }
  .empty { opacity: .6; padding: 24px 0; text-align: center; }
</style>
</head>
<body>
<h1>stash</h1>
<form id="add">
  <input id="url" placeholder="Paste a magnet link or .torrent URL" autocomplete="off" required>
  <button class="primary">Add</button>
</form>
<div id="msg"></div>
<video id="player" controls hidden></video>
<div id="list"></div>

<script>
const $ = (id) => document.getElementById(id);
const el = (tag, cls, text) => {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
};
const size = (n) => {
  const u = ["B", "KB", "MB", "GB", "TB"];
  let i = 0;
  while (n >= 1024 && i < u.length - 1) { n /= 1024; i++; }
  return n.toFixed(i ? 1 : 0) + " " + u[i];
};
const playable = (name) => /\.(mp4|m4v|webm|mov|mp3|m4a|ogg|wav|flac)$/i.test(name);

async function call(method, path, body) {
  const res = await fetch(path, {
    method,
    headers: body ? { "content-type": "application/json" } : {},
    body: body ? JSON.stringify(body) : undefined,
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.human_readable || data.error || res.statusText);
  return data;
}

$("add").addEventListener("submit", async (ev) => {
  ev.preventDefault();
  $("msg").textContent = "";
  try {
    await call("POST", "/api/transfers", { url: $("url").value.trim() });
    $("url").value = "";
    refresh();
  } catch (e) {
    $("msg").textContent = e.message;
  }
});

function play(src) {
  const p = $("player");
  p.hidden = false;
  p.src = src;
  p.play().catch(() => {});
  p.scrollIntoView({ behavior: "smooth", block: "nearest" });
}

function render(torrents) {
  const list = $("list");
  list.replaceChildren();
  if (!torrents.length) {
    list.append(el("div", "empty", "No transfers yet."));
    return;
  }
  for (const t of torrents) {
    const s = t.stats || {};
    const total = s.total_bytes || 0;
    const pct = total ? (100 * s.progress_bytes) / total : 0;
    const paused = s.state === "paused";

    const card = el("div", "t");
    const head = el("div", "head");
    head.append(el("div", "name", t.name || t.info_hash));
    const toggle = el("button", null, paused ? "Resume" : "Pause");
    toggle.onclick = () => call("POST", `/api/transfers/${t.id}/${paused ? "start" : "pause"}`).then(refresh);
    const del = el("button", null, "Delete");
    del.onclick = () => call("DELETE", `/api/transfers/${t.id}`).then(refresh);
    head.append(toggle, del);

    const bits = [s.finished ? "done" : s.state || "…", `${pct.toFixed(1)}%`, `${size(s.progress_bytes || 0)} / ${size(total)}`];
    const speed = s.live?.download_speed?.human_readable;
    if (speed && !s.finished) bits.push(speed);
    const peers = s.live?.snapshot?.peer_stats?.live;
    if (peers != null) bits.push(`${peers} peers`);

    const bar = el("div", "bar");
    const fill = el("div");
    fill.style.width = pct + "%";
    bar.append(fill);

    const files = el("ul", "files");
    (t.files || []).forEach((f, i) => {
      if (!f.included) return;
      const li = el("li");
      const src = `/api/transfers/${t.id}/files/${i}`;
      li.append(el("span", "fn", f.name), el("span", "sz", size(f.length)));
      if (playable(f.name)) {
        const a = el("a", null, "Play");
        a.href = "#";
        a.onclick = (ev) => { ev.preventDefault(); play(src); };
        li.append(a);
      }
      const dl = el("a", null, "Download");
      dl.href = src;
      dl.download = f.name.split("/").pop();
      li.append(dl);
      files.append(li);
    });

    card.append(head, el("div", "meta", bits.join(" · ")), bar, files);
    list.append(card);
  }
}

async function refresh() {
  try {
    render((await call("GET", "/api/transfers")).torrents);
  } catch (e) {
    $("msg").textContent = e.message;
  }
}
refresh();
setInterval(refresh, 1500);
</script>
</body>
</html>
